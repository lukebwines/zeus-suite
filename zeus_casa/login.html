<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'">
<title>ZEUS Casa · Accedi</title>
<link rel="stylesheet" href="/login.css?v=1.7.2">
<link rel="icon" type="image/svg+xml" href="/zeus-icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#28594a"><meta name="application-name" content="ZEUS Casa"></head>
<body><main class="login-layout" aria-label="Accesso riservato ZEUS Casa">
<section class="login-panel">
<header class="login-brand"><span class="login-brand-symbol" aria-hidden="true">⌂</span><span><strong>ZEUS</strong><small>— C A S A —</small></span></header>
<div class="login-content"><h1>Bentornato</h1><p class="login-subtitle">Accedi al tuo spazio ZEUS Casa<br>e gestisci i tuoi immobili con semplicità.</p>
<form id="login" action="/api/session/login" method="post">
<label for="user">Username</label><div class="login-input"><svg class="login-field-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.4"/><path d="M5.3 20v-2c0-3.5 2.8-6 6.7-6s6.7 2.5 6.7 6v2"/></svg><input id="user" name="user" type="text" autocomplete="username" required maxlength="120" placeholder="Inserisci il tuo username"></div>
<label for="password">Password</label><div class="login-input"><svg class="login-field-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Inserisci la tua password"><button class="login-eye" id="toggle-password" type="button" aria-label="Mostra password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div>
<label class="login-remember" for="remember-user"><input id="remember-user" type="checkbox"> <span>Ricorda nome utente</span></label>
<button class="login-submit" type="submit">Accedi <span aria-hidden="true">→</span></button>
<p id="message" role="alert" aria-live="polite" class="login-message"></p>
</form></div>
<footer class="login-foot"><span aria-hidden="true">♙</span> Accesso protetto da autenticazione ZEUS</footer>
</section>
<aside class="login-photo" aria-label="Fotografia della casa"><img id="zeus-login-photo" src="/login-cortile.jpg" alt="Fotografia della casa" loading="eager" decoding="async"></aside>
</main><script src="/login.js?v=1.7.2"></script></body></html>
